<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUESS AI - Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>GUESS AI</h1>
        <div id="timer">02:00</div>
    </header>
    <main>
        <div id="messages">
            <div class="message-box">
                <p>Система: Привіт! Чи готовий ти почати гру?</p>
            </div>
        </div>
        <footer>
            <input type="text" id="userInput" placeholder="Write here..." required>
            <button onclick="sendMessage()">Send</button>
        </footer>
    </main>
    <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-analytics.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAMUXw7GRwhq_-Pz7RFU6yR01izYi4cCuw",
    authDomain: "guess-ai.firebaseapp.com",
    projectId: "guess-ai",
    storageBucket: "guess-ai.firebasestorage.app",
    messagingSenderId: "182407504429",
    appId: "1:182407504429:web:0e662e4136b286f6a2cea4",
    measurementId: "G-62J2DK6D97"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
</script>

<script>
  const sessionType = Math.random() > 0.5 ? "ai" : "human";
  const username = prompt("Введіть своє ім’я");

  let timeLeft = 120;
  const timerElement = document.getElementById("timer");

  const countdown = setInterval(() => {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    timerElement.textContent = `${minutes < 10 ? "0" : ""}${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
    if (timeLeft <= 0) {
      clearInterval(countdown);
      window.location.href = "результати.html";
    }
    timeLeft--;
  }, 1000);

  function sendMessage() {
    const input = document.getElementById("userInput");
    const message = input.value.trim();
    const container = document.getElementById("messages");

    if (message) {
      const box = document.createElement("div");
      box.className = "message-box";
      box.innerHTML = `<p>${username}: ${message}</p>`;
      container.appendChild(box);
      input.value = "";

      db.ref("chat").push({ username, message });

      if (sessionType === "ai") {
        const reply = getBotReply(message);
        setTimeout(() => {
          const aiBox = document.createElement("div");
          aiBox.className = "message-box";
          aiBox.innerHTML = `<p>AI Bot 🤖: ${reply}</p>`;
          container.appendChild(aiBox);
        }, 1500);
      }
    }
  }

  function getBotReply(msg) {
    msg = msg.toLowerCase();
    if (msg.includes("привіт") || msg.includes("хай")) {
      return "Привіт! Як справи?";
    } else if (msg.includes("кіно")) {
      return "Я люблю фільми. А ти?";
    } else if (msg.includes("гра")) {
      return "Я граю в шахи!";
    } else {
      return "Цікаво! Розкажи більше.";
    }
  }
</script>

</body>
</html>
